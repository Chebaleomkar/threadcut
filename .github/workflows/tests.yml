name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch; the GPU tests skip without CUDA)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.12.1 numpy pytest
      - name: Engine and chat-layer tests
        run: python -m pytest -q -rs tests
      - name: Every benchmark task fails as shipped and passes when fixed
        run: python tasks/check_solvable.py
